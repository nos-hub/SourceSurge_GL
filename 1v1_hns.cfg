// 1v1 preset: hide & seek (menu > Presets > hns)
// Only melee + camera. Each player has a clock, only the hider's clock ticks.
// The seeker killing the hider swaps the roles. First clock to 0 wins.
// Does not touch ss_1v1 so loading a preset never turns the mode on or off.
ss_1v1_mode 1
ss_1v1_weapons "weapon_crowbar,weapon_camera"
ss_1v1_hns_hider_weapons "weapon_camera"
ss_1v1_hns_time 120
ss_1v1_hns_respawn 3
ss_1v1_godtime 1
ss_1v1_god_endonfire 1
ss_1v1_timelimit 0
ss_1v1_fullammo 1
