// 1v1 preset: melee + grapple (menu > Presets > melee)
// Does not touch ss_1v1 so loading a preset never turns the mode on or off.
ss_1v1_mode 0
ss_1v1_weapons "weapon_crowbar,weapon_grapple"
ss_1v1_killlimit 15
ss_1v1_timelimit 0
ss_1v1_respawn_min 192
ss_1v1_respawn_max 768
ss_1v1_respawn_zrange 512
ss_1v1_pick_timeout 8
ss_1v1_godtime 1
ss_1v1_god_endonfire 1
ss_1v1_los 1
ss_1v1_fullammo 1
